services:
  - type: web
    name: mafia-telegram-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_TOKEN
        sync: false
      - key: DEFAULT_LANGUAGE
        value: az
      - key: DB_URL
        value: sqlite+aiosqlite:///mafia_bot.db
